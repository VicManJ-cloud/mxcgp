# Compila sitio/ y lo publica en GitHub Pages en cada push a master.
#
# configure-pages entrega la URL y la ruta base reales: sin dominio propio el
# sitio queda en <usuario>.github.io/<repositorio>/; en cuanto se configure
# cgpmx.com en Settings → Pages, la base pasa a ser '/' sin tocar nada aquí.
name: Publicar sitio

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sitio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sitio/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      # Si la instalación falla, las últimas líneas salen como anotaciones:
      # así se leen desde el resumen de la ejecución sin abrir el registro.
      - name: Instalar dependencias
        shell: bash  # con pipefail, para que el fallo de npm no lo tape tee
        run: |
          echo "::notice::node $(node -v) npm $(npm -v)"
          npm ci 2>&1 | tee npm-ci.log || {
            grep -iE "missing|invalid|sync|ERESOLVE|engine|version" npm-ci.log | head -n 9 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - run: npm run build
        env:
          SITIO_URL: ${{ steps.pages.outputs.origin }}
          SITIO_BASE: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio/dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
